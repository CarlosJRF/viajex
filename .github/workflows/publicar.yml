# Prueba, compila y sube el sitio estático a la rama gh-pages (R30)
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix client

      - name: Pruebas
        run: npm test --prefix client

      - name: Compilar con la base del repositorio
        run: npm run build --prefix client
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # Cada publicación reemplaza gh-pages y nombra el commit de main que la originó
      - name: Subir client/dist a gh-pages
        working-directory: client/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
