# Contrato GraphQL (v2) entre el código de la app y el mock del navegador (client/src/mocks/).
# Montos: Int en CLP sin decimales. Fechas: String ISO AAAA-MM-DD. Sin usuarios ni login.

type Pais {
  id: ID!
  nombre: String!
}

type Actividad {
  id: ID!
  nombre: String!
}

type Vuelo {
  id: ID!
  aerolinea: String!
  horarioIda: String!
  horarioVuelta: String!
  "CLP por pasajero, ida y vuelta"
  precio: Int!
}

type Hotel {
  id: ID!
  nombre: String!
  "Estrellas de 1 a 5"
  categoria: Int!
  "CLP por noche"
  precioNoche: Int!
}

type Tour {
  id: ID!
  nombre: String!
  actividades: [Actividad!]!
  "CLP por persona"
  precio: Int!
}

type Destino {
  id: ID!
  nombre: String!
  imagen: String!
  pais: Pais!
  actividadesPopulares: [Actividad!]!
  vuelos: [Vuelo!]!
  hoteles: [Hotel!]!
  tours: [Tour!]!
}

type Reserva {
  id: ID!
  destino: Destino!
  vuelo: Vuelo
  hotel: Hotel
  tours: [Tour!]!
  pasajeros: Int!
  fechaSalida: String!
  fechaRegreso: String!
  total: Int!
}

"Datos para crear una reserva; el total lo calcula el cliente"
input ReservaNueva {
  destinoId: ID!
  vueloId: ID
  hotelId: ID
  tourIds: [ID!]!
  pasajeros: Int!
  fechaSalida: String!
  fechaRegreso: String!
  total: Int!
}

"Reemplaza los campos editables; el destino no se puede cambiar"
input ReservaCambios {
  vueloId: ID
  hotelId: ID
  tourIds: [ID!]!
  pasajeros: Int!
  fechaSalida: String!
  fechaRegreso: String!
  total: Int!
}

type Query {
  "Catálogo completo en orden del catálogo"
  destinos: [Destino!]!
  "null si el destino no existe"
  destino(id: ID!): Destino
  "Reservas guardadas en este navegador, en orden de creación"
  reservas: [Reserva!]!
  "null si no existe o fue eliminada"
  reserva(id: ID!): Reserva
}

type Mutation {
  crearReserva(datos: ReservaNueva!): Reserva!
  "Error GraphQL si la reserva no existe"
  actualizarReserva(id: ID!, cambios: ReservaCambios!): Reserva!
  "Devuelve el id eliminado; error GraphQL si no existe"
  eliminarReserva(id: ID!): ID!
}
